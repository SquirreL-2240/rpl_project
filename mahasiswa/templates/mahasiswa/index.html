{% extends 'mahasiswa/base.html' %}
{% load static %}

{% block content %}

<!-- Bootstrap & Font Awesome -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<!-- CSS eksternal (GLOBAL untuk semua halaman mahasiswa) -->
<link rel="stylesheet" href="{% static 'mahasiswa/css/mahasiswa.css' %}">

<!-- Header -->
<div class="custom-header shadow-sm">
    Praktikum RPL — Django
</div>

<!-- Konten -->
<div class="main-wrapper">
    <div class="custom-card text-center">

        <div class="badge-app text-uppercase">
            Django Web App
        </div>

        <div class="img-container">
            <img src="{% static 'mahasiswa/img/logo.png' %}" alt="Logo">
        </div>

        <h3 class="title-text">Selamat Datang</h3>

        <p class="desc-text">
            Ini halaman Django kamu. Mulai kelola data mahasiswa dengan mudah.
        </p>

        <hr class="divider">

       <div class="d-grid gap-3">
    <!-- Tombol Mulai dengan class btn-blue -->
    <button class="btn btn-blue w-100" onclick="alert('Selamat belajar!')">
        <i class="fas fa-play me-2"></i> Mulai
    </button>
    
    <!-- Tombol Daftar dengan class btn-outline-blue -->
    <a href="{% url 'daftar_mahasiswa' %}" class="btn-outline-blue w-100">
        <i class="fas fa-bars me-2"></i> Lihat Daftar Mahasiswa
    </a>
</div>

    </div>
</div>

<!-- Footer -->
<div class="custom-footer">
    © 2025 Praktikum RPL
</div>

{% endblock %}
